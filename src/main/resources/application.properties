spring.application.name=mecanica-os-service

# ===============================
# DATASOURCE - POSTGRESQL
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/mecanica_os}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mecanica_os}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mecanica_os_local}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# DATABASE MIGRATIONS
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT:8081}

app.jwt.public-key=${JWT_PUBLIC_KEY:}
app.jwt.issuer=${JWT_ISSUER:mecanica-auth}

# ===============================
# OBSERVABILITY
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENVIRONMENT:local}
logging.structured.format.console=logstash

# Payment events: enable when connected to the shared broker.
app.messaging.enabled=${MESSAGING_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:mecanica_local}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:mecanica_local_password}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false
management.health.rabbit.enabled=${MESSAGING_ENABLED:false}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
