apiVersion: v1
kind: Service
metadata:
  name: postgres-execution
spec:
  clusterIP: None
  selector: {app: postgres-execution}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-execution
spec:
  serviceName: postgres-execution
  replicas: 1
  selector:
    matchLabels: {app: postgres-execution}
  template:
    metadata:
      labels: {app: postgres-execution}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: mecanica_execution}
            - {name: POSTGRES_USER, value: mecanica_execution}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          envFrom:
            - secretRef: {name: postgres-execution-secret}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mecanica-gp3
        resources:
          requests: {storage: 10Gi}
