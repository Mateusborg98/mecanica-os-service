apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports: [{name: amqp, port: 5672}, {name: management, port: 15672}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: {app: rabbitmq}
  template:
    metadata:
      labels: {app: rabbitmq}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          ports: [{containerPort: 5672}, {containerPort: 15672}]
          env:
            - {name: RABBITMQ_NODENAME, value: rabbit@rabbitmq-0.rabbitmq.mecanica-fase4.svc.cluster.local}
            - {name: RABBITMQ_USE_LONGNAME, value: "true"}
          envFrom:
            - secretRef: {name: rabbitmq-secret}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            timeoutSeconds: 10
            periodSeconds: 15
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mecanica-gp3
        resources:
          requests: {storage: 10Gi}
