apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports: [{name: mongo, port: 27017}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongodb
          image: mongo:8.0
          args: [--wiredTigerCacheSizeGB, "0.5"]
          ports: [{containerPort: 27017}]
          envFrom:
            - secretRef: {name: mongodb-secret}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1536Mi}
          readinessProbe:
            exec: {command: [mongosh, --quiet, --eval, 'quit(db.adminCommand("ping").ok ? 0 : 1)']}
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: mecanica-gp3
        resources:
          requests: {storage: 10Gi}
